<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статическая композиция</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            width: 600px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        .image-wrapper {
            width: 100%;
            height: 350px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        .btn {
            display: inline-block;
            background-color: #2c3e50;
            color: #fff;
            padding: 15px 40px;
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-wrapper">
            <img src="cat.jpg" alt="Серьезный кот">
        </div>
        <h1>Спокойствие и Надежность</h1>
        <p>Это статическая композиция. Все элементы выровнены по центру, создавая ощущение устойчивости и классического порядка. Ничто не отвлекает, взгляд плавно скользит сверху вниз.</p>
        <button class="btn">Узнать больше</button>
    </div>
</body>
</html>
