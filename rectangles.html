<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Композиция из прямоугольников</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #e9e9e9;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Сетка 2 колонки x 3 строки: слева фото, справа три прямоугольника */
        .composition {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            grid-template-rows: auto auto auto;
            grid-template-areas:
                "photo title"
                "photo text"
                "photo button";
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        /* 1. ФОТО — большой прямоугольник */
        .photo {
            grid-area: photo;
            background-color: #fff;
            border: 2px solid #111;
            overflow: hidden;
            min-height: 500px;
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            display: block;
        }

        /* 2. ЗАГОЛОВОК — прямоугольник */
        .title {
            grid-area: title;
            background-color: #111;
            color: #fff;
            padding: 30px;
            border: 2px solid #111;
            display: flex;
            align-items: center;
        }
        .title h1 {
            font-size: 32px;
            line-height: 1.1;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 3. ТЕКСТ — прямоугольник */
        .text {
            grid-area: text;
            background-color: #fff;
            color: #222;
            padding: 30px;
            border: 2px solid #111;
            font-size: 15px;
            line-height: 1.6;
        }

        /* 4. КНОПКА — маленький прямоугольник */
        .button-box {
            grid-area: button;
            background-color: #fff;
            border: 2px solid #111;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-box button {
            width: 100%;
            background-color: #111;
            color: #fff;
            border: none;
            padding: 18px 20px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }
        .button-box button:hover {
            background-color: #444;
        }

        /* Мобильная адаптация */
        @media (max-width: 700px) {
            .composition {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "title"
                    "photo"
                    "text"
                    "button";
            }
            .photo { min-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="composition">

        <!-- 1. ФОТО -->
        <div class="photo">
            <img src="cat.png" alt="Кот — прямоугольный модуль">
        </div>

        <!-- 2. ЗАГОЛОВОК -->
        <div class="title">
            <h1>Четыре<br>прямоугольника<br>— одна форма</h1>
        </div>

        <!-- 3. ТЕКСТ -->
        <div class="text">
            Каждый объект композиции приведён к форме прямоугольника.
            Вместе они складываются в модульную сетку, где границы блоков
            становятся ритмом. Прямые углы, чёткие линии, отсутствие
            скруглений — всё подчинено геометрии.
        </div>

        <!-- 4. КНОПКА -->
        <div class="button-box">
            <button>Смотреть</button>
        </div>

    </div>
</body>
</html>
