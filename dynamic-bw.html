<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динамическая композиция — Ч/Б</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Arial Black', sans-serif;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }
        .image-block {
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 60%;
            height: 80%;
            transform: rotate(-3deg);
            z-index: 1;
        }
        .image-block img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(130%);
            border: 5px solid #ffffff;
        }
        .text-block {
            position: relative;
            z-index: 2;
            width: 55%;
            padding: 80px 0 0 80px;
            color: #fff;
        }
        h1 {
            font-size: 72px;
            line-height: 0.9;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            color: #ffffff;
            transform: skew(-5deg);
            text-shadow: 4px 4px 0px #000;
        }
        p {
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            line-height: 1.4;
            max-width: 400px;
            margin-bottom: 40px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-left: 5px solid #ffffff;
        }
        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000;
            padding: 20px 50px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            transform: skew(-5deg);
            box-shadow: 10px 10px 0px #000;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: skew(-5deg) translate(5px, 5px);
            box-shadow: 5px 5px 0px #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-block">
            <h1>Движение<br>и Энергия</h1>
            <p>Чёрно-белая версия динамической композиции. Контраст монохрома подчёркивает диагонали и асимметрию сильнее, чем цвет — движение становится резче.</p>
            <button class="btn">Забрать энергию</button>
        </div>
        <div class="image-block">
            <img src="cat.png" alt="Серьезный кот в ч/б">
        </div>
    </div>
</body>
</html>
