<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытая композиция</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #333;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
        }
        .text-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10% 0 15%;
        }
        h1 {
            font-size: 48px;
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 30px;
            color: #111;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: #777;
            max-width: 350px;
            margin-bottom: 50px;
        }
        .btn {
            display: inline-block;
            background: transparent;
            color: #333;
            padding: 15px 35px;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #333;
            border-radius: 50px;
            width: fit-content;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn:hover {
            background: #333;
            color: #fff;
        }
        .image-side {
            position: relative;
            overflow: hidden;
        }
        .image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mask-image: linear-gradient(to right, transparent, black 20%);
            -webkit-mask-image: linear-gradient(to right, transparent, black 20%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-side">
            <h1>Свобода и<br>Пространство</h1>
            <p>Открытая композиция не ограничивает пространство. Много пустоты, легкие шрифты и отсутствие рамок создают ощущение воздушности и современности.</p>
            <button class="btn">Исследовать</button>
        </div>
        <div class="image-side">
            <img src="cat.jpg" alt="Серьезный кот">
        </div>
    </div>
</body>
</html>
